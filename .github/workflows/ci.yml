name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Nothing is pip-installed. This repo is a collection of unrelated
      # experiments and only number-finder/ has a requirements.txt; the rest
      # import flask, flask_cors, apscheduler, pandas, spacy, nltk, pdfminer,
      # wordcloud, matplotlib, openai, anthropic and dotenv with no manifest
      # anywhere. compileall parses without importing, so it needs none of
      # them and cannot be fooled by whatever happens to be on a laptop.
      #
      # The exclusion is not a workaround for a flaky check: that file is a
      # Colab export (its own docstring says "Automatically generated by
      # Colaboratory") and line 26 is the notebook magic `!pip install
      # pdfminer`, which is not Python and never has been. Its runnable
      # descendants v1_original.py through v3_claude_code.py are all checked,
      # as is the .ipynb it came from — by not being Python at all.
      - name: Byte-compile all Python
        run: python -m compileall -q -x 'labs/resume-parser-wordcloud/resume_parser_to_word_cloud\.py' .

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fb-poster/facebook-scheduler/package-lock.json

      # `node --check` is only a real gate on files Node parses as CommonJS.
      # On anything it detects as an ES module (a top-level import or export)
      # current Node exits 0 even for outright broken syntax — verified against
      # this repo's own sources — so listing those files here would buy
      # coverage that does not exist. They are skipped loudly rather than
      # silently, and the step is left doing the one thing it does honestly:
      # checking the browser-extension code (tab-tamer/, server-location*/),
      # which nothing else in this repo ever compiles. The ESM files under
      # fb-poster/facebook-scheduler are covered by the build and test steps
      # below instead; the two under fb-poster/src are covered by nothing, for
      # the reason given on the install step.
      - name: Syntax-check standalone JS
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r f; do
            if grep -qE '^[[:space:]]*(import|export)[[:space:]]' "$f"; then
              echo "skip (ES module — node --check cannot gate these, see ci.yml): $f"
              continue
            fi
            if node --check "$f"; then
              echo "ok: $f"
            else
              status=1
            fi
          done < <(git ls-files '*.js')
          exit $status

      # fb-poster/facebook-scheduler is the only JS app here that still
      # installs, tests and builds: create-react-app 5, a committed lockfile,
      # and one real test in src/App.test.js.
      #
      # Its sibling fb-poster/ is an older copy of the same app pinned to
      # react-scripts 3 (webpack 4), which dies with ERR_OSSL_EVP_UNSUPPORTED
      # on any Node built against OpenSSL 3 and has no tests. It is left out
      # deliberately — wiring it up would mean either resurrecting a dead
      # toolchain or setting --openssl-legacy-provider to make CI pretend a
      # broken app works.
      - name: Install
        working-directory: fb-poster/facebook-scheduler
        run: npm ci

      # CI=true is already set by Actions, which is what makes jest run once
      # instead of watching; --watchAll=false makes that explicit rather than
      # environment-dependent.
      - name: Test
        working-directory: fb-poster/facebook-scheduler
        run: npm test -- --watchAll=false

      # The build is what actually type-checks nothing and compiles everything:
      # it is the only step that puts index.js, reportWebVitals.js and the JSX
      # through babel, so it catches breakage the single test never reaches.
      - name: Build
        working-directory: fb-poster/facebook-scheduler
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bin/managekeys is the repo's only shell script and it is zsh, not bash:
      # #!/bin/zsh, and it leans on zsh builtins and semantics throughout
      # (`print -u2 --`, `[[ $x =~ 'quoted-pattern' ]]`, arithmetic flags).
      # `bash -n` parses it without complaint and proves nothing, because the
      # differences are semantic, not syntactic. The GitHub Ubuntu images do
      # not ship zsh, so 500+ lines of keychain handling get the right parser
      # for the price of one apt install.
      - name: Install zsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - name: Syntax-check zsh scripts
        run: zsh -n bin/managekeys
